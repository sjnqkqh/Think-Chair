[project]
name = "think-chair"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.137.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.49.0",
    "python-multipart>=0.0.9",
    "langchain-openai>=0.1.0",
    "sqlalchemy>=2.0.51",
    "langsmith>=0.9.0",
    "pyjwt>=2.13.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-core>=1.4.8",
    "langgraph>=1.2.6",
    "sse-starlette>=3.4.5",
    "pydantic-settings>=2.0.0",
    "bcrypt>=4.0.0",
    "jinja2>=3.1.6",
    "pydantic>=2.0.0",
    "httpx>=0.28.1",
    "lxml>=6.0.0",
    "trafilatura>=2.1.0",
    "chromadb>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "tiktoken>=0.12.0",
    "langfeather[langchain]>=0.3.2",
    "psycopg[binary]>=3.2",
    "langgraph-checkpoint-postgres>=2.0.0",
]

[project.scripts]
run-ai-response-comparison = "app.evaluation.run_response_comparison:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "unit: 순수 함수·DB 단위 테스트 (HTTP/그래프 미사용)",
    "integration: TestClient 단건 요청 수준의 API·렌더링 테스트",
    "e2e: AsyncClient 기반 다단계 전체 흐름 테스트",
    "live_web: 실제 공개 웹 페이지·Brave Search·실계정 research E2E 검사",
]
