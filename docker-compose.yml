services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: thinkchair
      POSTGRES_PASSWORD: thinkchair
      POSTGRES_DB: thinkchair
    ports:
      - "5432:5432"
    volumes:
      - think-chair-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkchair -d thinkchair"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  think-chair:
    build:
      context: .
      dockerfile: Dockerfile
    image: think-chair:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep manuscript files and (until later PRs) local chroma/checkpoint paths
      # on the named volume. App metadata uses Compose Postgres via DATABASE_URL.
      DATA_ROOT: /data
      STORAGE_ROOT: /data/storage
      CHROMA_ROOT: /data/chroma_db
      DATABASE_URL: postgresql+psycopg://thinkchair:thinkchair@db:5432/thinkchair
    volumes:
      - think-chair-data:/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  think-chair-data:
  think-chair-pgdata:
